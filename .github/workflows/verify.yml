name: verify

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "git+https://github.com/0mn1si2i5/OmniPet.git@f2137e74b81f5658be6bcac46574c435354b7f7d"
      - run: python -m unittest discover -s tests -v
      - name: Verify public repository
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            python scripts/verify-repository.py --base-ref "$BASE_REF"
          else
            python scripts/verify-repository.py
          fi
      - name: Verify one-pet pull request scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --name-only -z "${{ github.event.pull_request.base.sha }}" > changed-paths.bin
          python scripts/verify-pr-scope.py --paths-file changed-paths.bin
